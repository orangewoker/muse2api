services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: unless-stopped
    ports:
      - "${MUSE2API_BIND:-0.0.0.0}:${MUSE2API_PORT:-18610}:18610"
    environment:
      MUSE2API_KEY: ${MUSE2API_KEY:-}
      MUSE2API_PUBLIC_BASE: ${MUSE2API_PUBLIC_BASE:-}
      MUSE2API_REPO: ${MUSE2API_REPO:-https://github.com/orangewoker/muse2api}
      MUSE2API_IMAGE_TIMEOUT: ${MUSE2API_IMAGE_TIMEOUT:-240}
      MUSE2API_VIDEO_TIMEOUT: ${MUSE2API_VIDEO_TIMEOUT:-600}
      MUSE2API_CHAT_TIMEOUT: ${MUSE2API_CHAT_TIMEOUT:-300}
      MUSE2API_QUEUE_TIMEOUT: ${MUSE2API_QUEUE_TIMEOUT:-900}
      MUSE2API_MAX_QUEUE: ${MUSE2API_MAX_QUEUE:-100}
      MUSE2API_TOOL_PROTOCOL: ${MUSE2API_TOOL_PROTOCOL:-0}
      MUSE2API_PROFILE_ROOT: /app/data/profiles
    volumes:
      - ./data:/app/data
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18610/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
